<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>5-Max MTT vs CPU</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="start" class="pn">
        <h2 style="margin-top: 0">5-Max MTT vs CPU</h2>
        <p>
          40人（あなた＋CPU39人・8卓）／開始10000点／ブラインド1〜13Lv／リエントリー1回（Lv1-2のみ）／ITM＝エントリー数の上位20%
        </p>
        <p>
          CPUは6タイプ：タイト・ルースアグレ・コーラー・マニアック・バランス・ICM意識。自分以外の卓は、あなたの1ハンドごとに1ハンド進みます。
        </p>
        <p>
          ネームドCPU（通常より強い）：<b style="color: #9acd32">Croque</b>／<b
            style="color: #4fc3f7"
            >Hubris</b
          >／<b style="color: #ff8ac8">Kaina</b>。各35%の確率であなたと同卓します。
        </p>
        <p>
          ブラインド間隔：<select id="spd">
            <option value="5">5分（標準）</option>
            <option value="2">2分</option>
            <option value="1">1分</option>
          </select>
        </p>
        <p id="st" style="color: var(--mu)"></p>
        <button onclick="begin()">トーナメント開始</button>
      </div>
      <div id="game" hidden>
        <div id="hd" class="pn"></div>
        <label style="font-size: 13px; color: var(--mu); display: block; margin-bottom: 8px"
          ><input type="checkbox" id="tyc" onchange="TY2(this.checked)" /> CPUタイプを表示</label
        >
        <div id="tb"></div>
        <div id="ct" class="pn" style="margin-top: 10px"></div>
        <div id="lg" class="pn"></div>
      </div>
      <div id="ov" class="pn" hidden></div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
