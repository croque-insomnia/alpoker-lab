<style>

</style></head><body><div id="app">
<div id="start" class="pn"><h2 style="margin-top:0">5-Max MTT vs CPU</h2>
<p>40人（あなた＋CPU39人・8卓）／開始10000点／ブラインド1〜13Lv／リエントリー1回（Lv1-2のみ）／ITM＝エントリー数の上位20%</p>
<p>CPUは6タイプ：タイト・ルースアグレ・コーラー・マニアック・バランス・ICM意識。自分以外の卓は、あなたの1ハンドごとに1ハンド進みます。</p><p>ネームドCPU（通常より強い）：<b style="color:#9acd32">Croque</b>／<b style="color:#4fc3f7">Hubris</b>／<b style="color:#ff8ac8">Kaina</b>。各35%の確率であなたと同卓します。</p>
<p>ブラインド間隔：<select id="spd"><option value="5">5分（標準）</option><option value="2">2分</option><option value="1">1分</option></select></p>
<p id="st" style="color:var(--mu)"></p><button onclick="begin()">トーナメント開始</button></div>
<div id="game" hidden><div id="hd" class="pn"></div><label style="font-size:13px;color:var(--mu);display:block;margin-bottom:8px"><input type=checkbox id=tyc onchange="TY2(this.checked)"> CPUタイプを表示</label><div id="tb"></div><div id="ct" class="pn" style="margin-top:10px"></div><div id="lg" class="pn"></div></div>
<div id="ov" class="pn" hidden></div></div>
<script>
const $=i=>document.getElementById(i),R=Math.random,SU='♠♥♦♣',RK='23456789TJQKA';
const LV=[[100,200,50],[140,280,70],[200,400,100],[280,560,140],[390,780,200],[550,1100,280],[820,1640,410],[1250,2500,630],[1900,3800,950],[2850,5700,1400],[4300,8600,2200],[6500,13000,3200],[9800,19600,4900]];
const TY=[['タイト',.2,.35,.1],['ルースアグレ',.7,.75,.35],['コーラー',.8,.15,.02],['マニアック',.95,.9,.5],['バランス',.45,.5,.2],['ICM意識',.4,.45,.15,1]];
const NM='Aki Ren Sora Yuu Hina Kai Mio Rin Haru Ken Nao Sho Mei Ryo Yui Dai Emi Jun Ayu Tom Saki Riku Nana Ito Mao Taku Rei Kou Mana Shin Ami Lee Max Eva Leo Zoe Jin Noa Hal'.split(' ');
let G={},S={n:0,w:0,ft:0,itm:0,pt:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('mtt5')))}catch(e){}
$('st').textContent=S.n?`戦績：${S.n}回 / 優勝${S.w} / FT${S.ft} / ITM${S.itm} / 仮pt合計${S.pt}`:'';
const alive=()=>G.P.filter(p=>p.alive).length,itm=()=>Math.floor(G.entries*.2);
const fb=x=>+(x/LV[G.lv][1]).toFixed(1);
const ls=()=>{try{return localStorage.getItem('mtt5ty')!='0'}catch(e){return 1}};
const cd=(c,h)=>h?'<i class="c b">??</i>':`<i class="c s${c/13|0}">${RK[c%13]}${SU[c/13|0]}</i>`;
function e5(a){const r=a.map(x=>x%13+2).sort((x,y)=>y-x),f=a.every(x=>(x/13|0)==(a[0]/13|0)),n={};r.forEach(x=>n[x]=(n[x]||0)+1);
let g=Object.keys(n).map(Number).sort((x,y)=>n[y]-n[x]||y-x);const k=g.map(x=>n[x]).join('');
const s=g.length==5&&(r[0]-r[4]==4||(r[0]==14&&r[1]==5));if(s&&r[0]==14&&r[1]==5)g=[5,4,3,2,1];
const c=s&&f?8:k=='41'?7:k=='32'?6:f?5:s?4:k=='311'?3:k=='221'?2:k=='2111'?1:0;
return c*1e10+g.reduce((v,x)=>v*15+x,0)}
function best(a){let m=0;if(a.length==5)return e5(a);
if(a.length==6){for(let i=0;i<6;i++)m=Math.max(m,e5(a.filter((_,k)=>k!=i)))}
else for(let i=0;i<7;i++)for(let j=i+1;j<7;j++)m=Math.max(m,e5(a.filter((_,k)=>k!=i&&k!=j)));return m}
function pre(h){let a=h[0]%13+2,b=h[1]%13+2;const su=(h[0]/13|0)==(h[1]/13|0);if(a<b)[a,b]=[b,a];
if(a==b)return .5+.04*(a-2);const g=a-b;return(a-2)/12*.35+(b-2)/12*.2+(su?.06:0)+(g==1?.05:g==2?.03:g==3?.01:0)}
function post(p,c){const B=c.board,all=p.h.concat(B),v=best(all),cat=v/1e10|0,hr=p.h.map(x=>x%13+2),bm=Math.max(...B.map(x=>x%13+2)),hm=Math.max(...hr);
let s=[.12+(hm>bm?.05:0),0,.72,.8,.86,.9,.95,1,1][cat];
if(cat==1){const pr=((v%1e10)/3375)|0;s=hr.includes(pr)?(pr>=bm?.62:.42):.2+(hm>bm?.05:0)}
if(B.length<5&&cat<4){let fd=0;for(let u=0;u<4;u++)if(all.filter(x=>(x/13|0)==u).length==4&&p.h.some(x=>(x/13|0)==u))fd=1;
if(fd)s+=.16;else{let o=0;for(let x=0;x<13;x++)if((best(all.concat(x))/1e10|0)==4)o++;s+=o>=2?.14:o?.07:0}}
return s}
function ai(p,c){const bb=c.bb,st=p.stack,eff=st/bb,L=c.board.length,late=c.pos==0||c.pos==c.n-1?1:0;
let l=p.l;if(p.icm&&alive()<=itm()+4&&alive()>itm())l-=.25;
const s=L?post(p,c):pre(p.h),po=c.toCall/((c.pot+c.toCall)||1),RR=x=>({t:'r',x}),CL={t:'c'},F={t:'f'};
if(!L){const open=c.cur<=bb;
if(eff<=12){const th=.6-.2*l-(12-eff)*.012-late*.04+(open?0:.06);return s>=th?RR(1e9):F}
const th=.62-.22*l-.05*late;
if(open){if(s>=th){return R()<.35+.65*p.a?RR(Math.round(bb*(2.2+R())/10)*10):CL}return F}
const need=th+.12+Math.min(.1,c.toCall/st*.3);
if(s>=Math.max(.74,.86-.15*p.a)||(s>=need+.1&&R()<p.a*.35))return RR(Math.round(c.cur*(2.6+R()*.8)));
return s>=need+po*.2?CL:F}
const a=s-.04*(c.L-2);
if(c.toCall==0){if((a>=.5-.1*p.a&&R()<.45+.45*p.a)||(a<.35&&R()<p.b*.3))return RR(Math.round(c.pot*(.4+R()*.4)));return CL}
if(a>=.85||(a>=.6&&R()<p.a*.3)||R()<p.b*.04)return RR(Math.round(c.cur+(c.pot+c.toCall)*(.5+R()*.4)));
return a>=po+.1-.15*l?CL:F}
const NC=[['Croque','#9acd32',.5,.55,.25],['Hubris','#4fc3f7',.5,.5,.2],['Kaina','#ff8ac8',.3,.4,.1]];
function eq(p,c){const B=c.board,base=p.h.concat(B),N=B.length==5?26:20;let w=0;for(let i=0;i<N;i++){const s=new Set(base),ru=()=>{let x;do x=R()*52|0;while(s.has(x));s.add(x);return x},o=[ru(),ru()],bb=B.slice();while(bb.length<5)bb.push(ru());const a=best(p.h.concat(bb)),b=best(o.concat(bb));w+=a>b?1:a==b?.5:0}return Math.pow(w/N,Math.min(2,Math.max(1,c.L-1)))}
function wet(B){let m=0;for(let u=0;u<4;u++)m=Math.max(m,B.filter(x=>(x/13|0)==u).length);const r=B.map(x=>x%13).sort((a,b)=>a-b);let g=0;for(let i=1;i<r.length;i++)if(r[i]-r[i-1]<=2)g++;const w=(m>=3?2:m==2?1:0)+(g>=2?1:0)-(new Set(r).size<r.length?1:0);return w<=0?0:w==1?1:2}
function ai2(p,c){const bb=c.bb,st=p.stack,B=c.board,L=B.length,n=c.n,al=alive(),it=itm(),k=p.k,ft=al<=5,late=c.pos==0||c.pos==n-1?1:0,M=st/(c.sb+bb+n*c.an);let l=p.l,ag=p.a;
if(al>it&&al<=it+3)l-=p.icm?.25:.08;
if(k=='Kaina'&&(n<=3||ft||al<=10)){l+=.3;ag+=.2}
const s=(L?eq(p,c):pre(p.h))+(R()-.5)*(k?.02:.1),po=c.toCall/((c.pot+c.toCall)||1),RR=x=>({t:'r',x:Math.round(x)}),CL={t:'c'},F={t:'f'};
if(!L){const open=c.cur<=bb,sm=k=='Hubris'||k=='Kaina'?8:k=='Croque'&&!ft?3:5;
if(M<=sm){const pt=.5-.022*(15-Math.min(M,15))-late*.03+(.5-l)*.1+(open?0:.07)-(n==2?.08:0);return s>=pt?RR(1e9):F}
let th=.55-.22*l-.06*late-(n==2?.1:0);
if(k=='Croque'&&open&&(late||c.pos==1)){const tl=1-c.ps.filter(q=>q!=p&&!q.fold).reduce((x,q)=>x+(q.l??.5),0)/Math.max(1,c.L-1);th-=.16*tl+.05}
if(open)return s>=th?(R()<.5+.5*ag?RR(bb*(2.2+R()*.8)):CL):F;
const need=th+.06+Math.min(.1,c.toCall/st*.3)-(po<.3?.06:0)-(p.lab.includes('BB')?.04:0);
if(s>=Math.max(.74,.86-.15*ag)||(s>=need+.08&&R()<ag*.4)||(k=='Hubris'&&s>=.4&&s<.55&&R()<.15))return RR(c.cur*(2.8+R()*.4));
return s>=need+po*.15?CL:F}
const a=s-(c.toCall?.04:0),tx=wet(B),spr=st/(c.pot||1);
if(c.toCall==0){if(a>=.6&&spr<=3)return RR(1e9);
if(k=='Croque'){if(tx<2){if(R()<(p.pfr?.7:.4))return RR(c.pot*.33)}else if(a>=.6||(a>=.4&&R()<.35))return RR(c.pot*(.66+R()*.1));return CL}
if(k=='Hubris'){const z=[.33,.5,.75][R()*3|0];if(a>=.62||(a>=.2&&a<.45&&R()<z/(1+2*z)*.7))return RR(c.pot*z);if(L==3&&a>=.35&&a<.5&&R()<.1)return RR(1e9);return CL}
if(a>=.62&&R()<.5+.45*ag)return RR(c.pot*(a>=.8?.7:.5+R()*.2));
if(p.pfr&&L==3&&c.L<=2&&R()<.35+.4*ag)return RR(c.pot*.4);
if(a>.22&&a<.4&&R()<p.b*.3&&k!='Kaina')return RR(c.pot*.5);
return CL}
const need=po+.03-.1*l+(k=='Kaina'?.08:0)+(k=='Croque'&&!ft&&po>.4?.12:0);
if(k=='Croque'&&!ft&&c.toCall>=st*.5&&a<.82&&M>5)return F;
if(a>=.88||(a>=.7&&R()<ag*.35)||(a>=.3&&a<.5&&L<5&&R()<p.b*.08&&c.toCall<c.pot*.6))return RR(c.cur+(c.pot+c.toCall)*(.6+R()*.4));
if(a>=need)return CL;
return po<.34&&a>=.28&&R()<.18+.25*l?CL:F}
function* hand(T){const lg=s=>{if(T==G.T)G.lg.push(s)},[sb,bb,an]=LV[G.lv];
T.p.forEach(p=>{p.h=null;p.lab='';p.show=0;p.fold=0;p.bet=0;p.tot=0;p.allin=0;p.acted=0;p.pfr=0});
const A=T.p.filter(p=>p.stack>0),n=A.length;if(n<2)return;
let bi=(A.findIndex(p=>p.id==T.btn)+1)%n;const ps=A.slice(bi).concat(A.slice(0,bi));T.btn=ps[0].id;T.ps=ps;
const d=[...Array(52).keys()].sort(()=>R()-.5),bd=T.bd=[];ps.forEach(p=>p.h=[d.pop(),d.pop()]);
const put=(p,x)=>{x=Math.min(x,p.stack);p.stack-=x;p.bet+=x;p.tot+=x;if(!p.stack)p.allin=1};
ps.forEach(p=>{const x=Math.min(an,p.stack);p.stack-=x;p.tot+=x;if(!p.stack)p.allin=1});
const s0=n==2?ps[0]:ps[1],b0=n==2?ps[1]:ps[2];ps[0].lab='D';s0.lab+=' SB';b0.lab+=' BB';put(s0,sb);put(b0,bb);
let cur=Math.max(s0.bet,b0.bet),minR=bb;const live=()=>ps.filter(p=>!p.fold);
lg(`--- ハンド開始 (Lv${G.lv+1}) ---`);
function* rnd(first){let i=first;ps.forEach(p=>p.acted=0);
for(;;){const L=live();if(L.length<2)return;const ca=L.filter(p=>!p.allin);
if(!ca.length||(ca.length==1&&ca[0].bet>=cur)||ca.every(p=>p.acted&&p.bet==cur))return;
const p=ps[i++%n];if(p.fold||p.allin||(p.acted&&p.bet==cur))continue;
const c={toCall:cur-p.bet,cur,minR,pot:ps.reduce((s,q)=>s+q.tot,0),bb,board:bd,L:L.length,pos:ps.indexOf(p),n,ps,an,sb};
const a=p.hero?yield{k:'hero',p,c}:ai2(p,c);let x=a.x;
if(!p.hero&&a.t=='r'&&x>=(p.bet+p.stack)*.55)x=p.bet+p.stack;
if(a.t=='f'&&c.toCall>0){p.fold=1;lg(p.name+' フォールド')}
else if(a.t=='r'&&Math.min(x,p.bet+p.stack)>cur){const mx=p.bet+p.stack;let X=Math.min(Math.round(x),mx);if(X<cur+minR&&X<mx)X=Math.min(cur+minR,mx);
const old=cur;if(!bd.length)p.pfr=1;put(p,X-p.bet);if(p.bet-old>=minR)minR=p.bet-old;cur=p.bet;ps.forEach(q=>{if(q!=p&&!q.fold&&!q.allin)q.acted=0});
lg(`${p.name} ${old?'レイズ':'ベット'} ${fb(p.bet)}BB${p.allin?' (オールイン)':''}`)}
else{const k=Math.min(c.toCall,p.stack);put(p,k);lg(p.name+(k?` コール ${fb(k)}BB`:' チェック')+(p.allin?' (オールイン)':''))}
p.acted=1;yield{k:'tick'}}}
yield*rnd(n==2?0:3%n);
for(const k of[3,1,1]){if(live().length<2)break;for(let j=0;j<k;j++)bd.push(d.pop());
ps.forEach(p=>{p.bet=0;p.acted=0});cur=0;minR=bb;yield{k:'tick'};yield*rnd(1)}
const L=live(),sd=L.length>1;if(sd)L.forEach(p=>{p.v=best(p.h.concat(bd));p.show=1});
let prev=0;for(const m of[...new Set(L.map(p=>p.tot))].sort((a,b)=>a-b)){let pot=0;ps.forEach(p=>pot+=Math.max(0,Math.min(p.tot,m)-prev));prev=m;
const el=L.filter(p=>p.tot>=m),mx=Math.max(...el.map(p=>p.v||0)),w=sd?el.filter(p=>p.v==mx):el,sh=Math.floor(pot/w.length);
w.forEach(p=>p.stack+=sh);w[0].stack+=pot-sh*w.length;lg(`▶ ${w.map(p=>p.name).join('・')} が ${fb(pot)}BB 獲得`)}
yield{k:'end'}}
function bust(T){T.p=T.p.filter(p=>{if(p.stack>0||p.hero)return 1;
if(G.lv<2&&!p.re&&R()<.5){p.stack=1e4;p.re++;G.entries++;return 1}p.alive=0;return 0})}
function bal(){let T=G.tables;T.forEach(t=>t.p=t.p.filter(p=>p.alive));T=T.filter(t=>t.p.length);const need=Math.ceil(alive()/5);
while(T.length>need){T.sort((a,b)=>a.p.length-b.p.length);const t=T.shift();t.p.forEach(p=>{T.sort((a,b)=>a.p.length-b.p.length)[0].p.push(p)})}
for(;;){T.sort((a,b)=>a.p.length-b.p.length);const lo=T[0],hi=T[T.length-1];if(hi.p.length-lo.p.length<2)break;const i=hi.p.findIndex(p=>!p.hero);lo.p.push(hi.p.splice(i<0?0:i,1)[0])}
G.tables=T}
function step(v){const g=G.cur;let r=g.next(v);
for(;!r.done;r=g.next()){const y=r.value;if(y.k=='hero'){G.req=y;render();return}
if(y.k=='tick'&&G.live){const h=G.hero;render();setTimeout(()=>step(),h.fold||h.allin?130:480);return}}end()}
function end(){G.live=0;const T=G.T,h=G.hero;bust(T);G.wait=1;render();
if(h.stack<=0){G.wait=0;if(G.lv<2&&!h.re){G.ask=1;render()}else fin()}}
function nx(){G.wait=0;G.lg=[];const o=G.T;while(Date.now()>=G.lvEnd&&G.lv<12){G.lv++;G.lvEnd+=G.dur}
G.tables.forEach(t=>{if(t!=G.T){const g=hand(t);while(!g.next().done);bust(t)}});
bal();G.T=G.tables.find(t=>t.p.includes(G.hero));if(G.T!=o)G.lg.push('※ テーブルが再編され、移動しました');
if(alive()==1)return fin();G.live=1;G.cur=hand(G.T);step()}
function reent(){const h=G.hero;h.stack=1e4;h.re++;G.entries++;G.ask=0;G.wait=1;G.lg.push('リエントリーしました');render()}
function fin(){const h=G.hero;h.alive=0;G.ask=0;const pl=alive()+1,pt=pl==1?6:pl==2?4:pl==3?3:pl<=5?2:pl<=itm()?1:0;
S.n++;if(pl==1)S.w++;if(pl<=5)S.ft++;if(pl<=itm())S.itm++;S.pt+=pt;try{localStorage.setItem('mtt5',JSON.stringify(S))}catch(e){}
render();$('ov').hidden=0;$('ov').innerHTML=`<h2 style="margin-top:0">${pl==1?'🏆 優勝！':pl+'位 でフィニッシュ'}</h2><p>${pl<=itm()?'ITM（入賞）':'ITM圏外'}${pl<=5?'／ファイナルテーブル':''}　エントリー ${G.entries}人（あなたのリエントリー ${h.re}回）</p><p style="color:var(--mu)">参考：サーキットpt（仮配点）${pt}pt／通算 ${S.n}回・優勝${S.w}・FT${S.ft}・ITM${S.itm}</p><button onclick="location.reload()">もう一度</button>`}
function render(){const T=G.T,h=G.hero,al=G.P.filter(p=>p.alive),[sb,bb,an]=LV[G.lv];
const rk=[...al].sort((a,b)=>b.stack-a.stack).indexOf(h)+1,avg=Math.round(al.reduce((s,p)=>s+p.stack,0)/Math.max(1,al.length));

const seat=p=>`<div class="s${p.fold?' f':''}${G.req&&G.req.p==p?' a':''}${p.hero?' h':''}"><b style="color:${p.col||'inherit'}">${p.name}</b> <small>${p.hero||!G.ty?'':p.ty[0]} ${p.lab||''}</small><div>${fb(p.stack)} BB</div><div>${p.h?p.h.map(c=>cd(c,!p.hero&&!p.show)).join(''):'&nbsp;'}</div><em>${p.bet?'bet '+fb(p.bet):''}</em></div>`;
const pot=(T.ps||[]).reduce((s,p)=>s+p.tot,0);
$('tb').innerHTML=`<div class=row>${T.p.filter(p=>!p.hero).map(seat).join('')}</div><div class=bd>${(T.bd||[]).map(c=>cd(c)).join('')||'&nbsp;'}<span>POT ${fb(pot)} BB</span></div>${seat(h)}`;
let c='';
if(G.req){const{p,c:q}=G.req,mx=p.bet+p.stack,mn=Math.min(q.cur+q.minR,mx);G.rx=G.rx0=mn;G.mn=mn;G.mx=mx;
c=q.toCall?`<button class=g onclick="A('f')">フォールド</button><button onclick="A('c')">コール ${fb(Math.min(q.toCall,p.stack))}BB</button>`:`<button onclick="A('c')">チェック</button>`;
if(mx>q.cur)c+=`<div class=rs><input id=sl type=range min=${mn} max=${mx} value=${mn} oninput="X(this.value)"><button onclick="A('r')">${q.cur?'レイズ':'ベット'} <span id=rv>${fb(mn)}</span>BB</button></div><div>`+(q.cur?[[2,'2x'],[2.5,'2.5x'],[3,'3x']].map(([f,n])=>`<button class=g onclick="X(${Math.round(q.cur*f)},1)">${n}</button>`):[[1/3,'1/3 Pot'],[.5,'1/2 Pot'],[1,'1 Pot']].map(([f,n])=>`<button class=g onclick="X(${Math.round(q.pot*f)},1)">${n}</button>`)).join('')+`<button class=g onclick="X(${mx},1)">All-in</button></div>`}
else if(G.ask)c='<p>バストしました。リエントリー（開始スタック）しますか？</p><button onclick="reent()">リエントリー</button><button class=g onclick="fin()">終了</button>';
else if(G.wait&&h.stack>0)c='<button onclick="nx()">次のハンド ▶</button>';
else if(!G.wait)c='<span style="color:var(--mu)">CPUのアクション中…</span>';
$('ct').innerHTML=c;$('lg').innerHTML=G.lg.slice(-14).map(s=>`<div>${s}</div>`).join('');$('lg').scrollTop=1e5}
function X(v,s){v=Math.max(G.mn,Math.min(G.mx,+v));G.rx=v;$('rv').textContent=fb(v);if(s)$('sl').value=v}
function A(t){G.req=null;step(t=='r'?{t,x:G.rx}:{t})}
function TY2(v){G.ty=v;try{localStorage.setItem('mtt5ty',v?1:0)}catch(e){}render()}
function tmr(){const e=$('tm');if(e&&G.lvEnd){const t=Math.max(0,G.lvEnd-Date.now())/1000|0,s=(t/60|0)+':'+String(t%60).padStart(2,'0');if(e.textContent!=s)e.textContent=s}}
setInterval(tmr,500);
function begin(){G={dur:+$('spd').value*6e4,lv:0,entries:40,lg:[],ty:ls()};$('tyc').checked=G.ty;G.lvEnd=Date.now()+G.dur;const nm=[...NM].sort(()=>R()-.5);G.P=[];
for(let i=0;i<40;i++){const t=TY[i%6];G.P.push(i&&i<4?{id:i,name:NC[i-1][0],k:NC[i-1][0],col:NC[i-1][1],ty:['ネームド'],l:NC[i-1][2],a:NC[i-1][3],b:NC[i-1][4],stack:1e4,re:0,alive:1}:i?{id:i,name:nm[i-1],ty:t,l:t[1]+(R()-.5)*.1,a:t[2]+(R()-.5)*.1,b:t[3],icm:t[4],stack:1e4,re:0,alive:1}:{id:0,name:'あなた',hero:1,ty:['—'],stack:1e4,re:0,alive:1})}
const sh=[...G.P].sort(()=>R()-.5);G.tables=[];for(let i=0;i<8;i++)G.tables.push({p:sh.slice(i*5,i*5+5),btn:-1});
G.hero=G.P[0];G.P.filter(p=>p.k).forEach(n=>{const h=G.tables.find(t=>t.p.includes(G.hero)),tn=G.tables.find(t=>t.p.includes(n)),w=R()<.35;if(w==(tn==h))return;const t2=w?h:G.tables.filter(t=>t!=h)[R()*7|0],cn=t2.p.filter(x=>!x.k&&!x.hero);if(!cn.length)return;const q=cn[R()*cn.length|0];tn.p[tn.p.indexOf(n)]=q;t2.p[t2.p.indexOf(q)]=n});G.T=G.tables.find(t=>t.p.includes(G.hero));$('start').hidden=1;$('game').hidden=0;nx()}
</script></body></html>
